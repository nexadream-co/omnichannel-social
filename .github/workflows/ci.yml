name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: socialz
          POSTGRES_PASSWORD: socialz
          POSTGRES_DB: socialz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialz" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://socialz:socialz@localhost:5432/socialz_test
      DATABASE_URL: postgresql://socialz:socialz@localhost:5432/socialz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Portability (docs/blueprint/19 §4): every tier-1 preset must build from the same source.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [node-server, aws-lambda, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NITRO_PRESET: ${{ matrix.preset }}
          SKIP_DB_DEPLOY: '1'

  # The newcomer path, public site and back-office in a real browser (docs/blueprint/17 Phase 14).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: socialz
          POSTGRES_PASSWORD: socialz
          POSTGRES_DB: socialz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialz" --health-interval 2s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['8025:8025', '1025:1025']
    env:
      DATABASE_URL: postgresql://socialz:socialz@localhost:5432/socialz
      DATABASE_URL_DIRECT: postgresql://socialz:socialz@localhost:5432/socialz
      MAILPIT_URL: http://localhost:8025
      ADAPTER_MODE: fake
      MEDIA_PROCESSOR_DRIVER: fake
      BETTER_AUTH_SECRET: ci-better-auth-secret-ci-better-auth-secret
      SETTINGS_SECRET: ci-settings-secret
      CRON_SECRET: ci-cron
      INTERNAL_SIGNING_SECRET: ci-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate && npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
