# Local development only: Postgres 17 + Mailpit (email capture).
# Production has no containers except the media processor (docs/blueprint/19).
name: socialz-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: socialz
      POSTGRES_PASSWORD: socialz
      POSTGRES_DB: socialz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialz"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
  # S3-compatible stand-in for Cloudflare R2 (the R2 driver talks to it through R2_ENDPOINT).
  # Dev only: it accepts any signature and serves objects publicly, like an R2 public bucket.
  s3:
    image: adobe/s3mock:4.7.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: socialz-media
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
volumes:
  pgdata:
