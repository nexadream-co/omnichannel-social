# Tier-1 fallback target: any VPS or Docker host (docs/blueprint/19 §4).
#   cp .env.production.example .env.production   # fill in, keep out of git
#   docker compose -f deploy/docker/compose.yml --env-file .env.production up -d --build
# TLS and the short-domain rewrite come from Cloudflare in front (19 §7); the "tunnel" profile runs
# cloudflared so the origin needs no open ports.
services:
  app:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    restart: unless-stopped
    env_file: ../../.env.production
    environment:
      MEDIA_PROCESSOR_URL: http://media:3200
    ports: ['127.0.0.1:3000:3000']
    depends_on: [media]

  media:
    build: { context: ../.., dockerfile: services/media-processor/Dockerfile }
    restart: unless-stopped
    environment:
      MEDIA_PROCESSOR_SECRET: ${MEDIA_PROCESSOR_SECRET}
    read_only: true
    tmpfs: ['/tmp']

  # The one cron entry: every minute → /api/internal/tick. Keep an external pinger too as a backup;
  # ticks are idempotent, so two sources are harmless.
  tick:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command: ['while true; do curl -fsS -m 55 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/internal/tick > /dev/null || echo "tick failed"; sleep 60; done']
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on: [app]

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.1.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]
